
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeBoard</title>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-weight: normal;
}

body {
    margin: 0;
    padding: 25px;
    background: #111;
    color: white;
}

h1 {
    font-size: 30px;
    margin-bottom: 20px;
}

input {
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 12px;
    font-size: 15px;
}

#search {
    width: 100%;
    margin-bottom: 12px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    background: #292929;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 12px 15px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #414141;
}

#soundGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 9px;
    margin-top: 15px;
}

.sound-button {
    min-height: 48px;
    overflow-wrap: anywhere;
}

#status {
    color: #aaa;
    margin: 15px 0;
    font-size: 13px;
}

.tts {
    display: flex;
    gap: 8px;
    margin-top: 22px;
}

#ttsText {
    flex: 1;
    min-width: 0;
}
</style>
</head>
<body>

<h1>MemeBoard</h1>

<input id="search" placeholder="Search sounds...">

<div class="controls">
    <button onclick="stopSound()">Stop sound</button>
    <button onclick="loadSounds()">Reload sounds</button>
</div>

<div id="status">Loading sounds...</div>
<div id="soundGrid"></div>

<div class="tts">
    <input id="ttsText" placeholder="Type something for text-to-speech...">
    <button onclick="speak()">Speak</button>
</div>

<script>
let sounds = [];
let activeAudio = null;

const grid = document.getElementById("soundGrid");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("search");


async function loadSounds() {
    statusText.textContent = "Loading sounds...";

    try {
        const response = await fetch("./sounds.json?v=3", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
        }

        const text = await response.text();

        if (!text.trim()) {
            throw new Error("sounds.json is EMPTY. Check your GitHub upload.");
        }

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error("Invalid JSON: " + text.slice(0, 150));
        }

        if (!Array.isArray(data)) {
            throw new Error("Expected a JSON array.");
        }

        sounds = data;
        displaySounds(sounds);
        statusText.textContent = `${sounds.length} sounds loaded.`;

    } catch (error) {
        console.error(error);
        statusText.textContent = error.message;
    }
}

}

function displaySounds(list) {
    grid.innerHTML = "";

    for (const sound of list) {
        if (!sound.title || !sound.mp3) continue;

        const button = document.createElement("button");
        button.className = "sound-button";
        button.textContent = sound.title;

        button.addEventListener("click", () => {
            playSound(sound.mp3);
        });

        grid.appendChild(button);
    }
}

function playSound(url) {
    stopSound();

    activeAudio = new Audio(url);
    activeAudio.volume = 0.8;

    activeAudio.play().catch(error => {
        console.error(error);
        statusText.textContent = "Could not play this sound.";
    });
}

function stopSound() {
    if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
    }

    speechSynthesis.cancel();
}

function speak() {
    const text = document.getElementById("ttsText").value.trim();

    if (!text) return;

    speechSynthesis.cancel();

    const message = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(message);
}

searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();

    const filtered = sounds.filter(sound =>
        sound.title.toLowerCase().includes(query)
    );

    displaySounds(filtered);
});

loadSounds();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeBoard</title>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-weight: normal;
}

body {
    margin: 0;
    padding: 25px;
    background: #111;
    color: white;
}

h1 {
    font-size: 30px;
    margin: 0 0 20px;
}

input, select {
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 12px;
    font-size: 15px;
}

#search {
    width: 100%;
    margin-bottom: 12px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

button {
    background: #292929;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 12px 15px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #414141;
}

#soundGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 9px;
    margin-top: 15px;
}

.sound-button {
    min-height: 48px;
    overflow-wrap: anywhere;
}

#status {
    color: #aaa;
    font-size: 13px;
    margin: 12px 0;
}

#loadMore {
    margin-top: 18px;
}

.tts {
    display: flex;
    gap: 8px;
    margin-top: 22px;
}

#ttsText {
    flex: 1;
    min-width: 0;
}

@media (max-width: 500px) {
    body {
        padding: 15px;
    }
}
</style>
</head>
<body>

<h1>MemeBoard</h1>

<input id="search" type="text" placeholder="Search sounds...">

<div class="controls">
    <select id="category">
        <option value="all">All sounds</option>
        <option value="vine boom">Memes</option>
        <option value="bruh">Reactions</option>
        <option value="gaming">Gaming</option>
        <option value="funny">Funny</option>
        <option value="tiktok">TikTok</option>
        <option value="sound effect">Sound effects</option>
    </select>

    <button id="stopButton">Stop sound</button>
    <button id="loadButton">Load 100+ sounds</button>
</div>

<div id="status">Ready</div>
<div id="soundGrid"></div>

<button id="loadMore">Load more</button>

<div class="tts">
    <input id="ttsText" type="text" placeholder="Type something for text-to-speech...">
    <button id="speakButton">Speak</button>
</div>

<script>
const API_HOSTS = [
    "https://myinstants-api.page.gd",
    "https://myinstants-api.vercel.app"
];

const grid = document.getElementById("soundGrid");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("search");
const categorySelect = document.getElementById("category");
const loadMoreButton = document.getElementById("loadMore");

let sounds = [];
let currentPage = 1;
let currentQuery = "vine boom";
let activeAudio = null;
let loading = false;
let usedUrls = new Set();

async function requestSounds(query, page) {
    let lastError;

    for (const host of API_HOSTS) {
        try {
            const url = `${host}/search?q=${encodeURIComponent(query)}&page=${page}`;
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Server returned ${response.status}`);
            }

            const result = await response.json();

            if (!result || !Array.isArray(result.data)) {
                throw new Error("Unexpected API response");
            }

            return result.data;
        } catch (error) {
            lastError = error;
        }
    }

    throw lastError || new Error("Could not connect to the sound API.");
}

function getSoundUrl(sound) {
    return sound.mp3 || sound.url || sound.audio || "";
}

function getSoundTitle(sound) {
    return sound.title || sound.name || "Untitled sound";
}

function addSound(sound) {
    const url = getSoundUrl(sound);
    const title = getSoundTitle(sound);

    if (!url || usedUrls.has(url)) return false;

    usedUrls.add(url);
    sounds.push(sound);

    const button = document.createElement("button");
    button.className = "sound-button";
    button.textContent = title;
    button.title = title;

    button.addEventListener("click", () => playSound(url));

    grid.appendChild(button);
    return true;
}

function playSound(url) {
    if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
    }

    activeAudio = new Audio(url);
    activeAudio.volume = 0.8;

    activeAudio.play().catch(() => {
        statusText.textContent = "Could not play this sound.";
    });
}

async function loadPage() {
    if (loading) return;

    loading = true;
    loadMoreButton.disabled = true;
    statusText.textContent = `Loading sounds...`;

    try {
        const results = await requestSounds(currentQuery, currentPage);

        let added = 0;

        for (const sound of results) {
            if (addSound(sound)) added++;
        }

        currentPage++;

        statusText.textContent =
            `${sounds.length} sounds loaded. ${added} new sounds added.`;

        if (results.length === 0) {
            loadMoreButton.disabled = true;
            statusText.textContent = "No more sounds found.";
        } else {
            loadMoreButton.disabled = false;
        }
    } catch (error) {
        console.error(error);
        statusText.textContent =
            "API unavailable: " + (error.message || "Connection failed.");
        loadMoreButton.disabled = false;
    }

    loading = false;
}

async function loadManySounds() {
    if (loading) return;

    loading = true;
    loadMoreButton.disabled = true;
    document.getElementById("loadButton").disabled = true;

    const queries = [
        "vine boom",
        "bruh",
        "among us",
        "roblox",
        "goofy",
        "meme",
        "laugh",
        "vine",
        "tiktok",
        "windows error",
        "cartoon",
        "sound effect"
    ];

    statusText.textContent = "Loading sounds...";

    for (const query of queries) {
        for (let page = 1; page <= 2; page++) {
            try {
                const results = await requestSounds(query, page);

                for (const sound of results) {
                    addSound(sound);
                }

                statusText.textContent =
                    `${sounds.length} unique sounds loaded...`;
            } catch (error) {
                console.error(query, page, error);
                break;
            }
        }
    }

    statusText.textContent =
        `${sounds.length} unique sounds loaded.`;

    loading = false;
    loadMoreButton.disabled = false;
    document.getElementById("loadButton").disabled = false;
}

function resetSounds(query) {
    sounds = [];
    usedUrls.clear();
    grid.innerHTML = "";
    currentPage = 1;
    currentQuery = query;
    loadPage();
}

searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        const query = searchInput.value.trim();
        if (query) resetSounds(query);
    }
});

categorySelect.addEventListener("change", () => {
    const query = categorySelect.value;

    if (query === "all") {
        resetSounds("meme");
    } else {
        resetSounds(query);
    }
});

loadMoreButton.addEventListener("click", loadPage);

document.getElementById("loadButton").addEventListener("click", loadManySounds);

document.getElementById("stopButton").addEventListener("click", () => {
    if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
    }

    speechSynthesis.cancel();
});

document.getElementById("speakButton").addEventListener("click", () => {
    const text = document.getElementById("ttsText").value.trim();

    if (!text) return;

    speechSynthesis.cancel();

    const message = new SpeechSynthesisUtterance(text);
    message.rate = 1;
    message.pitch = 1;
    message.volume = 1;

    speechSynthesis.speak(message);
});

resetSounds("vine boom");
</script>

</body>
</html>
